 <header class="pagehead" style="padding-bottom:20px">
  <h1>Contact</h1>
  <p class="lede" style="margin-top:6px">For speaking, advisory, mentorship or media enquiries, please get in touch.</p>
 </header>
 <div class="contact-grid solo">
  <div>
   <form id="enquiry" novalidate>
    <label for="subject">Enquiry</label>
    <select id="subject" name="subject">
     <option value="speaking">Speaking</option>
     <option value="advisory">Advisory</option>
     <option value="roundtable">Roundtable</option>
     <option value="mentorship">Mentorship</option>
     <option value="media">Media</option>
     <option value="meeting">Schedule a call or meeting</option>
     <option value="other">Other</option>
    </select>
    <div class="row">
     <div><label for="name">Name</label><input id="name" name="name" autocomplete="name"></div>
     <div><label for="org">Organisation</label><input id="org" name="org" autocomplete="organization"></div>
    </div>
    <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email">
    <label for="msg">Message</label><textarea id="msg" name="message"></textarea>
    <button class="btn" type="submit">Send</button>
    <p class="formnote" id="formnote" aria-live="polite"></p>
   </form>
  </div>
 </div>
